services:

  postgres:
    image: postgres:16

    container_name: insightcart_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # backend:
  #   build:
  #     context: ./backend

  #   container_name: insightcart_backend

  #   restart: unless-stopped

  #   env_file:
  #     - .env

  #   ports:
  #     - "8502:8000"

  #   depends_on:
  #     - postgres

  backend:
    build:
      context: ./backend

    container_name: insightcart_backend

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./backend:/app

    ports:
      - "8502:8000"

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    depends_on:
      - postgres
  # frontend:
  #   build:
  #     context: ./frontend

  #   container_name: insightcart_frontend

  #   restart: unless-stopped

  #   env_file:
  #     - .env

  #   ports:
  #     - "8501:8501"

  #   depends_on:
  #     - backend
  
  frontend:
    build:
      context: ./frontend

    container_name: insightcart_frontend

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./frontend:/app

    ports:
      - "8501:8501"

    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501

    depends_on:
      - backend

volumes:
  postgres_data:
